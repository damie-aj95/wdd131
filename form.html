<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <main class="form-container">

        <div class="form-header">
            <h1>Product Review</h1>
        </div>
        <form action="review.html" method="get">
            <div class="field-group">
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Choose a Product ...</option>
                </select>
            </div>
            <fieldset>
                 <legend>Overall Rating</legend>

                <input type="radio" id="rating1" name="rating" value="1" required>
                <label for="rating1">★</label>
        
                <input type="radio" id="rating2" name="rating" value="2" required>
                <label for="rating2">★★</label>
                
                
                <input type="radio" id="rating3" name="rating" value="3" required>
                <label for="rating3">★★★</label>
            
                <input type="radio" id="rating4" name="rating" value="4" required>
                <label for="rating4">★★★★</label>
                
                
                <input type="radio" id="rating5" name="rating" value="5" required>
                <label for="rating5">★★★★★</label>
                
            </fieldset>
            <div class="field-group">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>
            <fieldset>
                <legend>Which features do you find useful in the product? <span class="optional">(Check all that apply)</span></legend>

                <div class="checkbox-item">
                    <input type="checkbox" id="durability" name="durability" value="durability">
                    <label for="durability">Durability</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="easeOfUse" name="easeOfUse" value="easeOfUse">
                    <label for="easeOfUse">Ease Of Use</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="performance" name="performance" value="performance">
                    <label for="performance">Performance</label>
                </div>
                <div>
                    <input type="checkbox" id="design" name="design" value="design">
                    <label for="design">Design</label>
                </div>
            </fieldset>
            <div class="field-group">
                <label for="review">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="review" name="review"></textarea>
            </div>
            <div class="field-group">
                <label for="username">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="username" name="username">
            </div>
            <input type="submit" value="Post Review">
            
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Damie Aj</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
